<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart City Solution Framework — แผนผังภาพรวม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gov1:#1E3A8A; --gov2:#3B82F6; --govS:#2563EB; --govBg:#EEF4FF;
    --edu1:#047857; --edu2:#10B981; --eduS:#059669; --eduBg:#ECFDF5;
    --liv1:#B45309; --liv2:#F59E0B; --livS:#D97706; --livBg:#FFFBEB;
    --wat1:#0E7490; --wat2:#06B6D4; --watS:#0891B2; --watBg:#ECFEFF;
    --mob1:#6D28D9; --mob2:#A855F7; --mobS:#7C3AED; --mobBg:#FAF5FF;
    --ink:#0F172A; --muted:#64748B; --line:#E5E9F0; --bg:#F8FAFC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 22px 70px}

  .hero{text-align:center;margin-bottom:6px}
  .hero h1{font-size:29px;font-weight:700;letter-spacing:.2px}
  .hero p{color:var(--muted);font-size:14.5px;margin-top:4px}
  .kpis{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 20px;text-align:center;min-width:104px}
  .kpi b{display:block;font-size:19px;font-weight:700}
  .kpi span{font-size:11.5px;color:var(--muted)}

  .tabs{display:flex;justify-content:center;gap:8px;margin:20px 0 22px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 20px;border-radius:999px;
    font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .tab:hover{border-color:#94A3B8;color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .panel{display:none} .panel.on{display:block}

  .pillar{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 22px rgba(15,23,42,.07);display:flex;flex-direction:column}
  .phead{padding:15px 18px;color:#fff;text-align:center;cursor:pointer}
  .phead .t{display:flex;align-items:center;justify-content:center;gap:9px;font-size:18.5px;font-weight:700;line-height:1.25}
  .phead .s{font-size:12.5px;color:rgba(255,255,255,.86);margin-top:2px}
  .phead svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .pbody{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}

  .pc{border-radius:14px;padding:13px 15px 14px;cursor:pointer;transition:.16s;border:1px solid transparent}
  .pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.10)}
  .pc .top{margin-bottom:8px}
  .vend{color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;letter-spacing:.2px}
  .pc h3{font-size:15.5px;font-weight:700;margin-bottom:4px;line-height:1.35}
  .pc p{font-size:13px;color:#475569}

  .govrow{display:flex;justify-content:center}
  .govrow .pillar{width:min(780px,100%)}
  .govrow .pbody{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .conn{position:relative;height:58px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .conn .stem{position:absolute;left:50%;top:0;width:3px;height:30px;background:var(--govS);transform:translateX(-50%);border-radius:2px}
  .conn .c{position:relative}
  .conn .c::before{content:'';position:absolute;top:28px;height:3px;border-radius:2px;background:var(--k)}
  .conn .c::after{content:'';position:absolute;left:50%;top:28px;width:3px;height:30px;transform:translateX(-50%);
    background:var(--k);border-radius:2px}
  .conn .c1::before{left:50%;right:-9px}
  .conn .c2::before,.conn .c3::before{left:-9px;right:-9px}
  .conn .c4::before{left:-9px;right:50%}

  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}
  @media(max-width:1080px){
    .cols,.conn{grid-template-columns:1fr}
    .conn{display:none}
    .govrow .pbody{grid-template-columns:1fr}
    .cols{gap:16px;margin-top:16px}
  }
  .hint{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}

  .drawer{position:fixed;top:0;right:0;height:100%;width:410px;max-width:93vw;background:#fff;
    box-shadow:-14px 0 40px rgba(15,23,42,.18);padding:28px 26px;overflow-y:auto;
    transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50}
  .drawer.on{transform:translateX(0)}
  .drawer .close{position:absolute;top:16px;right:18px;border:none;background:#F1F5F9;width:32px;height:32px;
    border-radius:50%;font-size:18px;cursor:pointer;color:var(--muted)}
  .dtag{display:inline-block;color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px}
  .drawer h2{font-size:21px;margin:12px 0 4px;line-height:1.35}
  .meta{display:flex;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
  .chip{background:#F1F5F9;border-radius:9px;padding:8px 13px;font-size:13px}
  .chip b{display:block;font-size:15px;margin-top:1px}
  .drawer h4{font-size:12.5px;color:var(--muted);letter-spacing:.6px;margin:20px 0 6px;text-transform:uppercase}
  .drawer p,.drawer li{font-size:14.5px;color:#334155}
  .drawer li{margin:6px 0 6px 18px}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:.28s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}

  .layer{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px}
  .layer h3{font-size:16.5px;margin-bottom:2px}
  .layer .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .card{flex:1 1 200px;border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:13px 15px;background:#FCFDFF}
  .card b{font-size:14.5px;display:block;margin-bottom:3px}
  .card span{font-size:13px;color:var(--muted)}
  .arrow{text-align:center;color:#94A3B8;font-size:20px;margin:2px 0 8px;letter-spacing:8px}

  /* ---- depa concept ---- */
  .qbox{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .quote{flex:1.5 1 420px;border-left:6px solid var(--govS);background:#fff;border-radius:0 16px 16px 0;padding:20px 24px}
  .quote .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .quote p{font-size:15.5px;line-height:1.65}
  .quote .src{font-size:11.5px;color:#94A3B8;margin-top:10px}
  .plain{flex:1 1 300px;border:1px solid #FDE68A;background:#FFFBEB;border-radius:16px;padding:20px 22px}
  .plain h3{font-size:16px;color:#92400E;margin-bottom:6px}
  .plain p{font-size:14px;color:#3F2E12}
  .dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .dim{background:#fff;border:1px solid var(--line);border-top:6px solid #CBD5E1;border-radius:14px;padding:14px 16px}
  .dim b{display:block;font-size:14.5px;line-height:1.3}
  .dim .en{font-size:11.5px;color:var(--muted)}
  .dim p{font-size:12.5px;color:#475569;margin-top:6px}
  .tagy,.tagn{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:8px}
  .tagy{color:#fff;background:#059669} .tagn{color:var(--muted);background:#E2E8F0}
  .crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
  .ct{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .ct .no{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;
    background:#1E3A8A;color:#fff;font-size:14px;font-weight:700;margin-bottom:8px}
  .ct b{display:block;font-size:14.5px;margin-bottom:5px;line-height:1.35}
  .ct p{font-size:12.5px;color:#475569}
  .ct .ans{display:block;font-size:12.5px;color:#065F46;background:#ECFDF5;border-radius:9px;padding:8px 10px;margin-top:9px}
  .skywrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .skywrap svg{width:min(430px,100%);height:auto}
  .skywrap .cap{flex:1 1 300px;font-size:14px;color:#334155}
  .skywrap .cap b{font-size:17px;display:block;margin-bottom:4px;color:var(--ink)}
  .dim .ico{display:block;margin-bottom:6px}
  .dim .ico svg{width:24px;height:24px}
  .ctype{display:flex;gap:12px;margin:10px 0 12px}
  .ctype>div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 6px}
  .ctype svg{width:66px;height:44px}
  .ctype b{display:block;font-size:13.5px;margin-top:4px}
  .ctype em{font-style:normal;font-size:11.5px;color:var(--muted)}
  .sech{font-size:19px;font-weight:700;margin:0 0 10px}
  .sech span{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>Smart City Solution Framework</h1>
    <p>แผนผังภาพรวมโครงการเมืองอัจฉริยะ · ทุกโครงการเชื่อมโยงกันเป็นระบบเดียว</p>
    <div class="kpis">
      <div class="kpi"><b>5</b><span>เสาหลัก</span></div>
      <div class="kpi"><b>11</b><span>โครงการ</span></div>
      <div class="kpi"><b>1</b><span>แพลตฟอร์มกลาง</span></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-p="depa">แนวคิด Smart City (depa)</button>
    <button class="tab" data-p="map">แผนผังภาพรวม</button>
    <button class="tab" data-p="flow">การเชื่อมโยงของระบบ</button>
  </div>

  <div class="panel on" id="depa"></div>

  <div class="panel" id="map">
    <div class="govrow" id="govrow"></div>
    <div class="conn">
      <div class="stem"></div>
      <div class="c c1" style="--k:var(--eduS)"></div>
      <div class="c c2" style="--k:var(--livS)"></div>
      <div class="c c3" style="--k:var(--watS)"></div>
      <div class="c c4" style="--k:var(--mobS)"></div>
    </div>
    <div class="cols" id="cols"></div>
    <p class="hint">▸ คลิกที่การ์ดโครงการหรือหัวข้อเสาหลัก เพื่อดูรายละเอียดและความเชื่อมโยง</p>
  </div>

  <div class="panel" id="flow"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><button class="close" id="closeBtn">×</button><div id="dbody"></div></aside>

const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function cardHTML(p,c,i){
  return `<div class="pc" data-p="${p.id}" data-i="${i}" style="background:var(${p.bg});border-color:${V(p.solid)}22">
    <h3>${c.t}</h3><p>${c.s}</p></div>`;
}
function pillarHTML(p){
  return `<div class="pillar">
    <div class="phead" data-p="${p.id}" style="background:linear-gradient(100deg,${V(p.g1)},${V(p.g2)})">
      <div class="t"><svg viewBox="0 0 24 24">${IC[p.icon]}</svg>${p.key}</div>
      <div class="s">${p.th}</div></div>
    <div class="pbody">${p.children.map((c,i)=>cardHTML(p,c,i)).join('')}</div></div>`;
}
document.getElementById('govrow').innerHTML=pillarHTML(GOV);
document.getElementById('cols').innerHTML=PILLARS.map(pillarHTML).join('');

function alignRows(){
  if(innerWidth<=1080){document.querySelectorAll('#cols .pc').forEach(e=>e.style.minHeight='');return;}
  const cols=[...document.querySelectorAll('#cols .pbody')].map(b=>[...b.children]);
  const max=Math.max(...cols.map(c=>c.length));
  for(let r=0;r<max;r++){
    const set=cols.map(c=>c[r]).filter(Boolean);
    set.forEach(e=>e.style.minHeight='');
    const h=Math.max(...set.map(e=>e.offsetHeight));
    if(set.length>1) set.forEach(e=>e.style.minHeight=h+'px');
  }
}
addEventListener('load',alignRows); addEventListener('resize',alignRows); setTimeout(alignRows,350);

const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),dbody=document.getElementById('dbody');

document.getElementById('map').addEventListener('click',e=>{

  if(pc){const p=ALL[pc.dataset.p],c=p.children[+pc.dataset.i];
    show(`<span class="dtag" style="background:${V(p.solid)}">${p.key}</span>

      <div class="src">ที่มา: สำนักงานส่งเสริมเศรษฐกิจดิจิทัล (depa) — แผนส่งเสริมการพัฒนาเมืองอัจฉริยะ · แนวคิด "เมืองน่าอยู่ เมืองทันสมัย"</div>

      หัวใจจึงอยู่ที่ <b>ข้อมูลต้องเชื่อมถึงกัน</b> ไม่ใช่ต่างคนต่างซื้อระบบแล้วใช้แยกกัน</p>
