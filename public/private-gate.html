<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Project</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#090d16; color:#f8fafc; font-family:'Segoe UI',system-ui,sans-serif; padding:16px;
    background-image: radial-gradient(circle at 15% 15%, rgba(99,102,241,0.15) 0%, transparent 45%), radial-gradient(circle at 85% 75%, rgba(236,72,153,0.12) 0%, transparent 45%); }
  .card { background:rgba(15,23,42,0.85); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:32px; max-width:440px; width:100%; box-shadow:0 0 40px rgba(99,102,241,0.15); }
  h1 { font-size:1.3rem; margin:0 0 8px; }
  p { color:#94a3b8; font-size:0.9rem; line-height:1.55; }
  label { display:block; font-size:0.8rem; color:#94a3b8; margin:14px 0 6px; }
  input, textarea { width:100%; box-sizing:border-box; background:rgba(9,13,22,0.8); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:10px 12px; color:#f8fafc; font-size:0.9rem; font-family:inherit; }
  button { margin-top:18px; width:100%; background:linear-gradient(135deg,#6366f1,#a855f7); color:#fff; border:none; border-radius:10px; padding:12px; font-size:0.95rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:wait; }
  .msg { margin-top:14px; font-size:0.85rem; border-radius:10px; padding:10px 12px; display:none; line-height:1.5; }
  .msg.ok { display:block; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35); color:#6ee7b7; }
  .msg.err { display:block; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.35); color:#fca5a5; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 Request access to this link</h1>
    <p>This form is for requesting access to our link <strong id="proj-title"></strong>. Please fill in all 3 fields below. Once the owner approves, you will receive an access link that is valid for <strong>24 hours</strong>.</p>
    <form id="req-form">
      <label>Your name</label>
      <input type="text" id="req-name" required maxlength="80">
      <label>Company name</label>
      <input type="text" id="req-company" required maxlength="120">
      <label>Email or phone number</label>
      <input type="text" id="req-contact" required maxlength="120">
      <label>Note (optional)</label>
      <textarea id="req-note" rows="2" maxlength="500"></textarea>
      <button type="submit" id="req-btn">Request access</button>
      <div class="msg" id="req-msg"></div>
    </form>
  </div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var slug = params.get('slug') || '';
  var title = params.get('title') || slug;
  document.getElementById('proj-title').textContent = title;
  document.title = 'Private Project - ' + title;
  document.getElementById('req-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('req-btn');
    var msg = document.getElementById('req-msg');
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      var res = await fetch('/api/access/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug: slug,
          name: document.getElementById('req-name').value.trim(),
          company: document.getElementById('req-company').value.trim(),
          contact: document.getElementById('req-contact').value.trim(),
          note: document.getElementById('req-note').value.trim()
        })
      });
      var data = await res.json();
      if (res.ok && data.success) {
        msg.className = 'msg ok'; msg.textContent = data.message;
        document.getElementById('req-form').style.display = 'none';
      } else {
        msg.className = 'msg err'; msg.textContent = (data && data.message) || 'Something went wrong. Please try again.';
      }
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = 'Could not reach the server. Please try again.';
    }
    btn.disabled = false; btn.textContent = 'Request access';
  });
})();
</script>
</body>
</html>
